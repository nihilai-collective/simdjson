name: Jsonifier Generic Benchmark
run-name: ${{ inputs.leg && format('{0} attempt {1}', inputs.leg, inputs.attempt) || github.event.head_commit.message || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      leg:
        description: 'Single compiler to run: clang or gcc (leave empty for both)'
        required: false
        default: ''
      attempt:
        description: 'Attempt number of this leg'
        required: false
        default: '1'
  push:
    branches:
      - add_jsonifier_generic

jobs:
  Dispatch-Legs:
    runs-on: ubuntu-latest
    if: inputs.leg == ''
    permissions:
      actions: write
      contents: read
    strategy:
      matrix:
        leg: [clang, gcc]

    steps:
      - name: Dispatch ${{ matrix.leg }} as its own run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run static-reflection-benchmark.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF_NAME"
          -f leg=${{ matrix.leg }}
          -f attempt=1

  build:
    if: inputs.leg != ''
    runs-on: macos-latest
    name: Benchmark on macOS ${{ inputs.leg }}
    outputs:
      rejected: ${{ steps.cpu.outputs.rejected }}

    steps:
      - name: Reject runners that are not Apple M2 Pro
        id: cpu
        env:
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          CPU=$(sysctl -n machdep.cpu.brand_string)
          echo "CPU: $CPU"
          if [[ "$CPU" != *"M2 Pro"* ]]; then
            echo "rejected=true" >> "$GITHUB_OUTPUT"
            echo "Landed on $CPU on attempt $ATTEMPT, aborting so this leg reruns on a different runner." >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Setup Clang
        if: inputs.leg == 'clang'
        run: |
          brew install llvm ninja
          echo "CXX_BIN=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
          echo "C_BIN=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV

      - name: Setup GCC
        if: inputs.leg == 'gcc'
        run: |
          brew install gcc ninja
          DEV_VERSION=$(ls "$(brew --prefix)/bin" | grep -E '^g\+\+-[0-9]+$' | sed 's/g++-//' | sort -n | tail -n 1)
          [ -n "$DEV_VERSION" ] || { echo "no Homebrew g++ found"; exit 1; }
          echo "CXX_BIN=$(brew --prefix)/bin/g++-$DEV_VERSION" >> $GITHUB_ENV
          echo "C_BIN=$(brew --prefix)/bin/gcc-$DEV_VERSION" >> $GITHUB_ENV

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ env.CXX_BIN }}
          -DCMAKE_C_COMPILER=${{ env.C_BIN }}
          -DSIMDJSON_DEVELOPER_MODE=ON
          -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --config Release -v --target bench_ondemand

      - name: Run
        continue-on-error: true
        run: |
          mkdir -p results
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize | tee results/cpu.txt
          "$CXX_BIN" --version | tee results/compiler.txt
          ./build/benchmark/bench_ondemand 2>&1 | tee results/bench_ondemand.txt

      - name: Upload results
        if: always() && steps.cpu.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: jsonifier-generic-macos-${{ inputs.leg }}
          path: results/

  Relaunch-Leg:
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.outputs.rejected == 'true' && fromJSON(inputs.attempt) < 100
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch ${{ inputs.leg }} again on a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
          LEG: ${{ inputs.leg }}
          ATTEMPT: ${{ inputs.attempt }}
        run: >-
          gh workflow run static-reflection-benchmark.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF_NAME"
          -f leg="$LEG"
          -f attempt=$(( ATTEMPT + 1 ))
